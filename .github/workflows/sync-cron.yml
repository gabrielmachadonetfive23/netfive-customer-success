name: Sincronização periódica (Smartsheet/Pipedrive/Notion)

# O plano Hobby da Vercel só permite Cron Jobs nativos 1x/dia, então
# usamos o agendador do GitHub Actions (gratuito) para chamar a rota de
# reconciliação a cada 30 minutos.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/sync
        run: |
          curl -sf -X GET "https://netfive-customer-success.vercel.app/api/cron/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Chamar /api/cron/qbr
        run: |
          curl -sf -X GET "https://netfive-customer-success.vercel.app/api/cron/qbr" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
